# Template Docs : https://tomfran.github.io/typo-wiki/features/

baseURL = 'https://tomhepworth.com/'
languageCode = 'en-uk'
title = 'Tom Hepworth'
theme = 'typo'
pluralizeListTitles = false

# Google analytics code
[services.googleAnalytics]
  ID = "G-09PCR5J27T"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "Tom Hepworth's Website"
faviconPath = 'favicon'

# Appearance settings
theme = 'light'
colorPalette = 'base16-default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = ''
homeIntroContent = """
Welcome
"""

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 January 2006'

showFooter = true
footerContent = "© Tom Hepworth 2025. Do not scrape this website for training LLMs"


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://uk.linkedin.com/in/thomashepworth"

# Main menu pages
[[params.menu]]
name = "Home"
url = "/"

[[params.menu]]
name = "Outside"
url = "/outside"

[[params.menu]]
name = "Inside"
url = "/inside"

